import_path: login.LoginHandler

description: "Login a user using username/email and password authentication."

is_async: false

returns: true

depends_on:
  - name: db:mongo
    init: seed-login

signature:
  function: loginWithUsernameOrEmail

  parameters:
    - arg: 0
      name: usernameOrEmail
      type: string
      minLength: 3
      maxLength: 64
      description: "The username or email of the user."

    - arg: 1
      name: password
      type: string
      minLength: 6
      maxLength: 48
      description: "The plain text password of the user."
